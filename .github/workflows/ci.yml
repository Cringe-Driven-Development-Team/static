name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# в PR новый коммит отменяет проверку старого. В main идущий запуск не отменяется, но очереди нет:
# группа держит один ожидающий запуск, более новый push его вытесняет. Для выкатки это допустимо —
# поздний коммит включает ранний
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check сравнивает static/ с main: нужна история, а не один коммит
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun run check

  upload:
    name: Upload
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ключ S3 лежит в environment и действует на весь проект Selectel
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Upload
        id: upload
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: bun run upload
      - name: Send to tg
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
          STATUS: ${{ job.status }}
          UPLOADED: ${{ steps.upload.outputs.uploaded }}
          SKIPPED: ${{ steps.upload.outputs.skipped }}
        run: bun scripts/index.ts notify "$STATUS" "$GITHUB_SHA"
